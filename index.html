<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Whayame</title>

<meta name="theme-color" content="#202c33">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body { margin:0; background:#111b21; font-family:Arial; }

.chat { height:100vh; display:flex; flex-direction:column; background:#0b141a; }

.header {
  display:flex; align-items:center; justify-content:space-between;
  background:#202c33; color:white; padding:10px;
  position:sticky; top:0; z-index:1000;
}

.left { display:flex; align-items:center; cursor:pointer; }

.header img {
  width:40px; height:40px; border-radius:50%; margin-right:10px;
}

.info { display:flex; flex-direction:column; }

.status { font-size:12px; color:#8696a0; }

.menu-icon { cursor:pointer; font-size:22px; color:white; }

.menu {
  display:none; position:absolute; right:10px; top:55px;
  background:#202c33; border-radius:10px; overflow:hidden;
  width:200px; z-index:2000;
}

.menu div {
  padding:12px; color:white; cursor:pointer;
  display:flex; gap:10px;
}

.menu div:hover { background:#2a3942; }

.messages { flex:1; padding:10px; overflow-y:auto; }

.msg { display:flex; flex-direction:column; margin:4px 0; }

.bubble {
  padding:10px; border-radius:10px;
  max-width:75%;
  white-space:pre-wrap;
  word-break:break-word;
}

.me { align-items:flex-end; }
.me .bubble { background:#005c4b; color:white; }

.other { align-items:flex-start; }
.other .bubble { background:#202c33; color:white; }

.name-user {
  font-size:12px;
  margin-bottom:3px;
}

.input {
  display:flex; padding:8px;
  background:#202c33;
  position:sticky; bottom:0;
  align-items:flex-end;
}

textarea {
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#2a3942;
  color:white;
  resize:none;
  max-height:120px;
  overflow-y:auto;
}

.input button {
  margin-left:8px;
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:#00a884;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">

    <div class="left" onclick="togglePerfilMenu()">
      <img src="https://i.pravatar.cc/150?img=3">
      <div class="info">
        <div>chat-whayame</div>
        <div class="status" id="status">online</div>
      </div>
    </div>

    <i class="bi bi-three-dots-vertical menu-icon" onclick="toggleMenu()"></i>

    <div id="menu" class="menu">
      <div onclick="acao('Fixar conversa')"><i class="bi bi-pin-angle"></i> Fixar</div>
      <div onclick="acao('Arquivar conversa')"><i class="bi bi-archive"></i> Arquivar</div>
      <div onclick="acao('Renomear')"><i class="bi bi-pencil"></i> Renomear</div>
      <div onclick="acao('Novo chat')"><i class="bi bi-chat"></i> Novo chat</div>
      <div onclick="acao('Apagar')"><i class="bi bi-trash"></i> Apagar</div>
    </div>

    <div id="perfilMenu" class="menu">
      <div onclick="partilhar()"><i class="bi bi-share"></i> Partilhar</div>
      <div onclick="acao('Perfil')"><i class="bi bi-person"></i> Perfil</div>
      <div onclick="acao('Configurações')"><i class="bi bi-gear"></i> Configurações</div>
    </div>

  </div>

  <div class="messages" id="chat"></div>

  <div class="input">
    <textarea id="mensagem" placeholder="Mensagem"></textarea>
    <button onclick="enviar()">➤</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBV9G7QiXvN7vbG4TxMqEL0BIvyC5dKC_k",
  authDomain: "chat-whayame.firebaseapp.com",
  projectId: "chat-whayame",
  storageBucket: "chat-whayame.firebasestorage.app",
  messagingSenderId: "974589254887",
  appId: "1:974589254887:web:c6ac9a00c67d66bd025642"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const meuNome = prompt("Digite seu nome:") || "Anónimo";
const statusRef = db.collection("status").doc(meuNome);
const input = document.getElementById("mensagem");

// 🔥 ENTER = QUEBRA LINHA (NÃO ENVIA)
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    return; // deixa quebrar linha normal
  }
});

// AUTO EXPANDIR
input.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});

// STATUS
statusRef.set({ online: true, digitando: false });

input.addEventListener("input", () => {
  statusRef.set({ online: true, digitando: true });
  setTimeout(() => {
    statusRef.set({ online: true, digitando: false });
  }, 1500);
});

window.addEventListener("beforeunload", () => {
  statusRef.set({ online: false, digitando: false });
});

db.collection("status").onSnapshot(snapshot => {
  let digitando = [];
  let online = [];

  snapshot.forEach(doc => {
    const d = doc.data();
    if (doc.id !== meuNome) {
      if (d.digitando) digitando.push(doc.id);
      if (d.online) online.push(doc.id);
    }
  });

  const s = document.getElementById("status");

  if (digitando.length) {
    s.innerHTML = digitando.join(", ") + " digitando...";
  } else if (online.length) {
    s.innerText = "online";
  } else {
    s.innerText = "offline";
  }
});

// COR POR NOME
function gerarCor(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) {
    hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  }
  return `hsl(${hash % 360},70%,60%)`;
}

// MENUS
function toggleMenu() {
  const m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

function togglePerfilMenu() {
  const m = document.getElementById("perfilMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

window.onclick = function(e) {
  if (!e.target.closest('.menu-icon') && !e.target.closest('.left')) {
    document.getElementById("menu").style.display = "none";
    document.getElementById("perfilMenu").style.display = "none";
  }
};

function partilhar() {
  const link = window.location.href;
  navigator.share ? navigator.share({url: link}) : alert(link);
}

function acao(nome) {
  alert(nome + " em breve");
}

// ENVIAR
function enviar() {
  if (input.value.trim() === "") return;

  db.collection("mensagens").add({
    nome: meuNome,
    texto: input.value,
    data: Date.now()
  });

  input.value = "";
  input.style.height = "auto";
}

// MOSTRAR
function mostrar(msg) {
  const chat = document.getElementById("chat");
  const classe = msg.nome === meuNome ? "me" : "other";

  chat.innerHTML += `
    <div class="msg ${classe}">
      ${classe === "other" ? `<div class="name-user" style="color:${gerarCor(msg.nome)}">${msg.nome}</div>` : ""}
      <div class="bubble">${msg.texto}</div>
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}

db.collection("mensagens")
.orderBy("data")
.onSnapshot(snapshot => {
  document.getElementById("chat").innerHTML = "";
  snapshot.forEach(doc => mostrar(doc.data()));
});
</script>

</body>
</html>
