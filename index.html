<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Chat WhatsApp</title>

<style>
body {
  margin: 0;
  background: #111b21;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.chat {
  width: 360px;
  height: 640px;
  background: #0b141a;
  display: flex;
  flex-direction: column;
  border-radius: 15px;
  overflow: hidden;
}

.header {
  background: #202c33;
  color: white;
  padding: 15px;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.msg {
  margin: 8px 0;
  display: flex;
  flex-direction: column;
}

.bubble {
  padding: 10px;
  border-radius: 10px;
  max-width: 75%;
}

.me {
  align-items: flex-end;
}
.me .bubble {
  background: #005c4b;
  color: white;
}

.other {
  align-items: flex-start;
}
.other .bubble {
  background: #202c33;
  color: white;
}

.name {
  font-size: 12px;
  margin-bottom: 3px;
}

.time {
  font-size: 10px;
  color: #8696a0;
  margin-top: 2px;
}

.input {
  display: flex;
  background: #202c33;
}

.input input {
  flex: 1;
  padding: 15px;
  border: none;
  outline: none;
  background: #2a3942;
  color: white;
}

.input button {
  background: #00a884;
  border: none;
  color: white;
  padding: 15px;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="chat">
  <div class="header">Chat 💬</div>
  <div class="messages" id="chat"></div>

  <div class="input">
    <input id="mensagem" placeholder="Mensagem">
    <button onclick="enviar()">➤</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBV9G7QiXvN7vbG4TxMqEL0BIvyC5dKC_k",
  authDomain: "chat-whayame.firebaseapp.com",
  projectId: "chat-whayame",
  storageBucket: "chat-whayame.firebasestorage.app",
  messagingSenderId: "974589254887",
  appId: "1:974589254887:web:c6ac9a00c67d66bd025642"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// NOME
const meuNome = prompt("Digite seu nome:") || "Anónimo";

// COR
function corDoNome(nome) {
  let hash = 0;
  for (let i = 0; i < nome.length; i++) {
    hash = nome.charCodeAt(i) + ((hash << 5) - hash);
  }
  return `hsl(${hash % 360}, 70%, 60%)`;
}

// MOSTRAR MENSAGEM
function mostrar(msg) {
  const chat = document.getElementById("chat");
  const classe = msg.nome === meuNome ? "me" : "other";
  const corNome = corDoNome(msg.nome);

  chat.innerHTML += `
    <div class="msg ${classe}">
      ${classe === "other" ? `<div class="name" style="color:${corNome}">${msg.nome}</div>` : ""}
      <div class="bubble">${msg.texto}</div>
      <div class="time">${new Date(msg.data).toLocaleTimeString()}</div>
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;
}

// ENVIAR PARA FIREBASE
function enviar() {
  const input = document.getElementById("mensagem");
  if (input.value === "") return;

  db.collection("mensagens").add({
    nome: meuNome,
    texto: input.value,
    data: Date.now()
  });

  input.value = "";
}

// RECEBER EM TEMPO REAL
db.collection("mensagens")
.orderBy("data")
.onSnapshot(snapshot => {
  document.getElementById("chat").innerHTML = "";
  snapshot.forEach(doc => {
    mostrar(doc.data());
  });
});

// MENSAGEM INICIAL (só 1 vez)
window.onload = () => {
  db.collection("mensagens").add({
    nome: "Sistema",
    texto: "Oi, como vai? 👋",
    data: Date.now()
  });
};

</script>

</body>
</html>
